[project]
name = "ai-requirement-workflow-engine"
version = "0.1.0"
description = "An AI-powered workflow engine for refining IT/SW requirements into development-ready specifications."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.13.4",
    "uvicorn>=0.30,<1.0",
]

[project.urls]
Repository = "https://github.com/LEESEOBAEK/ai-requirement-workflow-engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/requirement_workflow"]
